  /api/v1/tokens:
    post:
      summary: 'Create a token'
      operationId: createAToken
      description: "Send a staff account's email and password and receive a bearer token.\nAsk for `abilities` explicitly to be able to write; without them the\ntoken can only read.\n\nThrottled to five attempts a minute per caller and per email address."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    examples:
                      - 7|xGqz0Rk2mVb8yQ1pLw4TfHsDcE6aJhN3
                  abilities:
                    type: array
                    items:
                      type: string
                    examples:
                      -
                        - 'services:read'
                        - 'bookings:read'
                  tenant:
                    type: string
                    examples:
                      - demo
                examples:
                  -
                    token: 7|xGqz0Rk2mVb8yQ1pLw4TfHsDcE6aJhN3
                    abilities:
                      - 'services:read'
                      - 'bookings:read'
                    tenant: demo
        422:
          description: 'Wrong credentials, or an account that belongs to another business.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    examples:
                      - 'These credentials do not match our records.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        items:
                          type: string
                        examples:
                          -
                            - 'These credentials do not match our records.'
                examples:
                  -
                    message: 'These credentials do not match our records.'
                    errors:
                      email:
                        - 'These credentials do not match our records.'
        429:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    examples:
                      - 'Too Many Attempts.'
                examples:
                  -
                    message: 'Too Many Attempts.'
      tags:
        - Tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'A staff account at this business. Must be a valid email address.'
                  examples:
                    - owner@demo.test
                password:
                  type: string
                  description: "That account's password."
                  examples:
                    - password
                device_name:
                  type: string
                  description: 'What this token is for. Shown when reviewing tokens. Must not be greater than 100 characters.'
                  examples:
                    - 'Front desk iPad'
                abilities:
                  type: array
                  description: 'One ability.'
                  items:
                    type: string
                    enum:
                      - 'services:read'
                      - 'bookings:read'
                      - 'bookings:write'
                  examples:
                    -
                      - 'bookings:write'
              required:
                - email
                - password
                - device_name
      security: []
    parameters:
      -
        in: path
        name: tenant
        description: "The business's subdomain. The token will only work here."
        required: true
        schema:
          type: string
          examples:
            - demo
