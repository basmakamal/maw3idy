version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      laravel:
        patterns: ["laravel/*", "illuminate/*"]
      dev-tooling:
        dependency-type: development

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # vite and laravel-vite-plugin pin each other's majors via peer deps;
      # bumping them separately can never pass `npm ci`.
      vite:
        patterns: ["vite", "laravel-vite-plugin", "@tailwindcss/vite", "@vitejs/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
