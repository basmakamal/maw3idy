name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the pipeline only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.2'

jobs:
  lint:
    name: Code style (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: vendor/bin/pint --test

  analyse:
    name: Static analysis (Larastan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: vendor/bin/phpstan analyse --memory-limit=1G --error-format=github

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: composer audit
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  tests:
    name: Tests (Pest, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: maw3idy_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # phpunit.xml sets non-forced defaults; these environment values win in CI.
    env:
      DB_HOST: 127.0.0.1
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, bcmath, intl
          coverage: pcov

      - uses: ramsey/composer-install@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run test suite
        run: vendor/bin/pest --ci --coverage --coverage-clover=coverage.xml

      # Floors for the whole suite and, separately, for the availability engine
      # and the tenancy layer: a healthy average can hide an untested engine.
      - name: Coverage floors
        run: php scripts/coverage-gate.php coverage.xml

      - uses: actions/upload-artifact@v7
        if: matrix.php == '8.2'
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  docs:
    name: API reference is current
    runs-on: ubuntu-latest

    # Scribe asks the database for a realistic id when a route binds a model,
    # so the reference is generated against the same seeded demo data locally
    # and here. Without that the two would differ and this check would be noise.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: maw3idy
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: 127.0.0.1
      DB_DATABASE: maw3idy
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql, bcmath, intl
          coverage: none
      - uses: ramsey/composer-install@v4

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan migrate --force --seed --ansi

      # Regenerate and diff: a merged change to a route, a form request or a
      # response shape has to arrive with its documentation.
      - name: Regenerate the reference
        run: php artisan docs:api

      - name: Fail if the committed reference is stale
        run: |
          if ! git diff --quiet -- public/docs; then
            echo "::error::public/docs is out of date. Run 'composer docs' and commit the result."
            git diff --stat -- public/docs
            exit 1
          fi
